# Run the tests in the locked environment (uv.lock)
name: pytest

# push only on main: a branch with a pull request is tested by the
# pull_request run, and running on every push as well tested each commit
# twice
on:
  push:
    branches:
      - main
  pull_request:

# a newer push to the same branch or pull request cancels the running tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags, for the setuptools-scm version

      - name: Free disk space (torch and its CUDA libraries are large)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: astral-sh/setup-uv@v6

      - name: Install the locked environment
        run: uv sync --frozen

      - name: Run pytest
        run: uv run --frozen pytest tests
