name: Linting

# push only on main: a branch with a pull request is linted by the
# pull_request run, and running on every push as well linted each commit
# twice
on:
  push:
    branches:
      - main
  pull_request:

# a newer push to the same branch or pull request cancels the running lint
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1
